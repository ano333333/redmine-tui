[package]
name = "redmine-tui-draft"
version = "0.1.0"
description = "draft app for redmine-tui"
authors = ["ano333333 <ano333333github@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
chrono = "0.4.43"
color-eyre = "0.6.3"
crossterm = "0.29.0"
directories = "6.0.0"
lazy_static = "1.5.0"
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9.2"
time = "0.3.53"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tui-markdown = "0.3.7"
yaml-rust = "0.4.5"

[dev-dependencies]
insta = "1.43.2"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
