[package]
name = "redmine-tui-draft"
version = "0.1.0"
description = "draft app for redmine-tui"
authors = ["ano333333 <ano333333github@gmail.com>"]
license = "MIT"
edition = "2024"

[workspace]
members = [".", "xtask"]
default-members = ["."]
resolver = "3"

[dependencies]
chrono = "0.4.43"
color-eyre = "0.6.3"
crossterm = "0.29.0"
directories = "6.0.0"
lazy_static = "1.5.0"
ratatui = { version = "0.30.0", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9.2"
reqwest = { version = "0.12.23", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1.0.219", features = ["derive"] }
time = "0.3.53"
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "time", "sync", "process"] }
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tui-markdown = "0.3.7"
yaml-rust = "0.4.5"

[dev-dependencies]
insta = "1.43.2"
serde_json = "1.0.143"
testcontainers = { version = "0.27.3", features = ["docker-compose"] }
wiremock = "0.6.5"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
