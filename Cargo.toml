[package]
name = "redmine-tui-draft"
version = "0.1.0"
description = "draft app for redmine-tui"
authors = ["ano333333 <ano333333github@gmail.com>"]
license = "MIT"
edition = "2024"

[workspace]
members = [".", "xtask"]
default-members = ["."]
resolver = "3"

[features]
default = ["native"]
native = [
    "dep:color-eyre",
    "dep:crossterm",
    "dep:directories",
    "dep:lazy_static",
    "dep:reqwest",
    "dep:tokio",
    "dep:tracing-error",
    "dep:tracing-subscriber",
    "ratatui/crossterm",
    "tui-markdown/highlight-code",
]
web-demo = [
    "dep:ratzilla",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "chrono/wasmbind",
    "uuid/js",
]

[dependencies]
chrono = "0.4.43"
color-eyre = { version = "0.6.3", optional = true }
crossterm = { version = "0.29.0", optional = true }
directories = { version = "6.0.0", optional = true }
futures = { version = "0.3", default-features = false, features = ["async-await"] }
lazy_static = { version = "1.5.0", optional = true }
# backendはplatform feature側で選び、描画に共通するfeatureだけを常時有効にする。
ratatui = { version = "0.30.0", default-features = false, features = ["std", "underline-color", "all-widgets", "macros", "layout-cache", "unstable-rendered-line-info"] }
ratatui-textarea = { version = "0.9.2", default-features = false }
reqwest = { version = "0.12.23", default-features = false, optional = true, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1.0.219", features = ["derive"] }
time = "0.3.53"
tokio = { version = "1.42", optional = true, features = ["rt", "rt-multi-thread", "time", "sync", "process", "macros"] }
tracing = "0.1.44"
tracing-error = { version = "0.2.1", optional = true }
tracing-subscriber = { version = "0.3.22", optional = true, features = ["env-filter"] }
tui-markdown = { version = "0.3.7", default-features = false }
uuid = { version = "1", features = ["v4"] }
yaml-rust = "0.4.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ratzilla = { version = "0.3.0", default-features = false, optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }
wasm-bindgen-futures = { version = "0.4.56", optional = true }

[dev-dependencies]
insta = "1.43.2"
serde_json = "1.0.143"
testcontainers = { version = "0.27.3", features = ["docker-compose"] }
wiremock = "0.6.5"
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "time", "sync", "process", "macros"] }

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
